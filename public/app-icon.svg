<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Medical Cross & Care Icon -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="220" y="100" width="72" height="312" rx="36" fill="#ffffff" />
    <!-- Horizontal bar -->
    <rect x="100" y="220" width="312" height="72" rx="36" fill="#ffffff" />
    <!-- Heartbeat / Smile Accent Curve -->
    <circle cx="256" cy="256" r="32" fill="#0d9488" />
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
  </g>
</svg>
